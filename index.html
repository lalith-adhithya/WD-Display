<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, initial-scale=1.0", shrink-to-fit="yes">
<title>WarpDrive Office Display</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green: #19B24A;
    --white: #ffffff;
    --bg: #0a0a0a;
  }

  html, body {
    width: 1920px; height: 1080px;
    overflow: hidden;
    font-family: "DM Sans", sans-serif;
    background: var(--bg);
    color: var(--white);
  }

  /* ── Background slideshow ── */
  .bg {
    position: fixed; inset: 0; z-index: 0;
  }
  .bg-img {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    opacity: 0; transition: opacity 1.2s ease;
  }
  .bg-img.active { opacity: 1; }

  /* ── Dark overlay for readability ── */
  .overlay {
    position: fixed; inset: 0; z-index: 1;
    background: linear-gradient(
      160deg,
      rgba(0,0,0,0.55) 0%,
      rgba(0,0,0,0.28) 50%,
      rgba(0,0,0,0.62) 100%
    );
  }

  /* ── Main layout ── */
  .display {
    position: fixed; inset: 0; z-index: 2;
    display: grid;
    grid-template-rows: 1fr auto;
    padding: 44px 56px 72px;
    gap: 0;
  }

  /* ── TOP SECTION ── */
  .top {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
  }

  /* Brand */
  .brand {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
  }
  .logo-row {
    display: flex;
    align-items: center;
    gap: 0;
  }
  /* WarpDrive logo image — white PNG */
  .logo-img {
    height: 44px;
    width: auto;
    object-fit: contain;
  }
  .greeting {
    font-size: 16px;
    color: rgba(255,255,255,0.7);
    font-weight: 300;
    margin-top: 6px;
    letter-spacing: 0.04em;
  }

  /* Time / Date */
  .timebox {
    position: fixed;
    top: 44px;
    right: 56px;
    text-align: right;
    z-index: 3;
  }
  .clock {
    font-size: 128px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -4px;
    text-indent: 0;
    color: var(--white);
  }
  .date-row {
    font-size: 20px;
    font-weight: 300;
    color: rgba(255,255,255,0.7);
    margin-top: 8px;
    letter-spacing: 0.04em;
  }

  /* Headlines card */
  .headlines-card {
    margin-top: 0;
    align-self: end;
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    padding: 20px 24px;
    max-width: 760px;
  }
  .hl-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.18em;
    color: var(--green);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .headline-text {
    font-size: 17px;
    font-weight: 400;
    line-height: 1.45;
    color: rgba(255,255,255,0.9);
    min-height: 50px;
  }
  .dot-row {
    display: flex;
    gap: 6px;
    margin-top: 12px;
  }
  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    transition: background 0.3s;
  }
  .dot.active { background: var(--green); }

  /* ── BOTTOM SECTION ── */
  .bottom {
    display: grid;
    grid-template-columns: 1fr auto;
    grid-template-rows: auto auto;
    align-items: end;
    gap: 16px 32px;
  }

  /* Ticker */
  .ticker-wrapper {
    overflow: hidden;
    position: relative;
    height: 26px;
  }
  .ticker-track {
    display: flex;
    align-items: center;
    height: 100%;
    white-space: nowrap;
    animation: ticker-scroll 60s linear infinite;
  }
  @keyframes ticker-scroll {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
  .ticker-item {
    font-size: 13px;
    color: rgba(255,255,255,0.65);
    font-weight: 300;
    padding-right: 32px;
    flex-shrink: 0;
  }
  .ticker-sep {
    color: var(--green);
    padding-right: 32px;
    flex-shrink: 0;
    font-size: 13px;
  }

  /* Weather */
  .weather-card {
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    padding: 20px 24px;
    width: 360px;
    align-self: start;
    margin-bottom: 16px;
  }
  .weather-main {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
  }
  .weather-icon { font-size: 42px; line-height: 1; }
  .weather-temp {
      font-size: 42px;
      font-weight: 700;
      color: var(--white);
      line-height: 1;
  }
  .weather-condition {
      font-size: 13px;
      color: rgba(255,255,255,0.55);
      font-weight: 300;
      margin-top: 4px;
  }
  .weather-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 14px;
  }
  .weather-stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
  }
  .weather-stat svg {
      opacity: 0.5;
  }
  .weather-stat-label {
      font-size: 10px;
      color: rgba(255,255,255,0.45);
      font-weight: 300;
      letter-spacing: 0.05em;
      text-transform: uppercase;
  }
  .weather-stat-value {
      font-size: 14px;
      font-weight: 500;
      color: var(--white);
  }
  .weather-city {
    font-size: 12px;
    color: rgba(255,255,255,0.45);
    font-weight: 300;
    margin-top: 2px;
    letter-spacing: 0.04em;
  }

  /* quote widget */
  .quote-widget {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    max-width: 900px;
    padding: 0 60px;
    z-index: 2;
  }
  .quote-text {
    font-size: 28px;
    font-style: italic;
    font-weight: 300;
    color: rgba(255,255,255,0.82);
    line-height: 1.5;
    letter-spacing: 0.01em;
  }
  .quote-author {
    margin-top: 14px;
    font-size: 15px;
    font-weight: 500;
    color: var(--green);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
</style>
</head>

// ── CONFIG ──────────────────────────────────────────────────────────────────
let allHeadlines = [];

// ── CLOCK & DATE ─────────────────────────────────────────────────────────────
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2, "0");
  const m = String(now.getMinutes()).padStart(2, "0");
  document.getElementById("clock").textContent = h + ":" + m;

  const days   = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const dateLine = days[now.getDay()] + ", " + now.getDate() + " " + months[now.getMonth()] + " " + now.getFullYear();
  document.getElementById("dateLine").textContent = dateLine;

  const hour = now.getHours();
  let greeting = "Good evening, team";
  if (hour >= 5  && hour < 12) greeting = "Good morning, team";
  else if (hour >= 12 && hour < 17) greeting = "Good afternoon, team";
  document.getElementById("greeting").textContent = greeting;
}
setInterval(updateClock, 1000);
updateClock();

async function loadWeather() {
  try {
    const resp = await fetch(
      "https://api.open-meteo.com/v1/forecast?latitude=12.9716&longitude=77.5946&current_weather=true&temperature_unit=celsius&hourly=relativehumidity_2m,apparent_temperature&windspeed_unit=kmh&timezone=Asia%2FKolkata"
    );
    const data = await resp.json();
    const wc = data.current_weather.weathercode;
    const temp = Math.round(data.current_weather.temperature);
    const wind = Math.round(data.current_weather.windspeed);

    const now = new Date();
    const hourIndex = data.hourly.time.findIndex(t => {
    const d = new Date(t);
    return d.getFullYear() === now.getFullYear() &&
          d.getMonth() === now.getMonth() &&
          d.getDate() === now.getDate() &&
          d.getHours() === now.getHours();
    });
    const humidity = hourIndex >= 0 ? data.hourly.relativehumidity_2m[hourIndex] : "--";
    const feelsLike = hourIndex >= 0 ? Math.round(data.hourly.apparent_temperature[hourIndex]) : "--";

    const iconMap = {
      0:"☀️", 1:"🌤", 2:"⛅", 3:"☁️",
      45:"🌫", 48:"🌫",
      51:"🌦", 53:"🌦", 55:"🌦",
      61:"🌧", 63:"🌧", 65:"🌧",
      80:"🌦", 81:"🌦", 82:"🌦",
      95:"⛈", 96:"⛈", 99:"⛈"
    };
    const conditionMap = {
      0:"Clear Sky", 1:"Mostly Clear", 2:"Partly Cloudy", 3:"Overcast",
      45:"Foggy", 48:"Foggy",
      51:"Light Drizzle", 53:"Drizzle", 55:"Heavy Drizzle",
      61:"Light Rain", 63:"Rain", 65:"Heavy Rain",
      80:"Light Showers", 81:"Showers", 82:"Heavy Showers",
      95:"Thunderstorm", 96:"Thunderstorm", 99:"Thunderstorm"
    };

    document.getElementById("weatherIcon").textContent = iconMap[wc] || "⛅";
    document.getElementById("weatherTemp").textContent = temp + "°C";
    document.getElementById("weatherDesc").textContent = conditionMap[wc] || "Bengaluru";
    document.getElementById("weatherHumidity").textContent = humidity + "%";
    document.getElementById("weatherFeels").textContent = feelsLike + "°C";
    document.getElementById("weatherWind").textContent = wind + " km/h";

    // ← PASTE AQI CODE HERE
    const aqiResp = await fetch("https://air-quality-api.open-meteo.com/v1/air-quality?latitude=12.9716&longitude=77.5946&current=european_aqi");
    const aqiData = await aqiResp.json();
    const aqi = Math.round(aqiData.current.european_aqi);
    const aqiEl = document.getElementById("weatherAQI");
    const aqiLabel = document.getElementById("aqiLabel");

    let aqiColor, aqiText;
    if      (aqi <= 50)  { aqiColor = "#4caf50"; aqiText = "Good"; }

    aqiEl.style.color = aqiColor;
    aqiLabel.textContent = "● " + aqiText;
    aqiLabel.style.color = aqiColor;

  } catch(e) {}
}

// ── LIVE NEWS — multi-source RSS parsed directly in browser ─────────────────
// Strategy: fetch RSS XML directly (Google News allows CORS), parse in browser.
// Multiple sources tried in parallel; first successful batch wins.
// No proxies, no API keys, no middlemen — zero caching issues.

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function parseRSSTitles(xmlText) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(xmlText, "text/xml");
  const items = doc.querySelectorAll("item");
  const titles = [];
  items.forEach(item => {
    const titleEl = item.querySelector("title");
    if (!titleEl) return;
    // Handle both CDATA and plain text
    let t = titleEl.textContent || "";
    // Google News appends " - Source Name" — strip it
    t = t.replace(/\s*-\s*[^-]+$/, "").trim();
    if (t.length > 15) titles.push(t);
  });
  return titles;
}

const LIVE_FEEDS = [
  "https://feeds.feedburner.com/ndtvnews-india-news",  // NDTV India
  "https://timesofindia.indiatimes.com/rssfeedstopstories.cms",
  "https://www.thehindu.com/news/national/feeder/default.rss",
];

function rss2jsonUrl(feedUrl) {
  return "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(feedUrl);
}

async function fetchFeed(url) {
  const resp = await fetch(rss2jsonUrl(url));
  if (!resp.ok) throw new Error("HTTP " + resp.status);
  const json = await resp.json();
  if (json.status !== "ok" || !json.items) return [];
  console.log("Raw titles from", url, json.items.map(i => i.title));
  return json.items
    .map(item => item.title ? item.title.replace(/\s*-\s*[^-]+$/, "").trim() : "")
    .filter(t => t.length > 15);
}

async function loadNews() {
  const results = await Promise.allSettled(LIVE_FEEDS.map(fetchFeed));
  const merged = [];
  for (const r of results) {
    if (r.status === "fulfilled" && r.value.length > 0) merged.push(...r.value);
  }

  const seen = new Set();
  const unique = merged.filter(h => {
    const key = h.slice(0, 40).toLowerCase();
    if (seen.has(key)) return false;
    seen.add(key); return true;
  });

  if (unique.length >= 5) {
    allHeadlines = shuffle(unique);
    currentHLIndex = 0;
    showHeadline();
    renderTicker(allHeadlines);
  } else {
    document.getElementById("headlineText").textContent = "Fetching headlines…";
    document.getElementById("tickerTrack").innerHTML = "";
  }
}

// ── HEADLINE CARD ────────────────────────────────────────────────────────────
const DISPLAY_COUNT = 4;

function buildDots(total, active) {
  const dotRow = document.getElementById("dotRow");
  dotRow.innerHTML = "";
  for (let i = 0; i < total; i++) {
    const d = document.createElement("div");
    d.className = "dot" + (i === active ? " active" : "");
    dotRow.appendChild(d);
  }
}

function showHeadline() {
  if (!allHeadlines.length) return;
  const headline = allHeadlines[currentHLIndex % allHeadlines.length];
  document.getElementById("headlineText").textContent = headline || "—";
  buildDots(Math.min(allHeadlines.length, DISPLAY_COUNT),
            currentHLIndex % Math.min(allHeadlines.length, DISPLAY_COUNT));
}

function advanceHeadline() {
  currentHLIndex = (currentHLIndex + 1) % allHeadlines.length;
  showHeadline();
}
showHeadline();
setInterval(advanceHeadline, 8000);

// ── TICKER ───────────────────────────────────────────────────────────────────
function renderTicker(headlines) {
  const track = document.getElementById("tickerTrack");
  track.innerHTML = "";
  const doubled = [...headlines, ...headlines]; // seamless loop
  doubled.forEach((h, i) => {
    const item = document.createElement("span");
    item.className = "ticker-item";
    item.textContent = h;
    track.appendChild(item);
    const sep = document.createElement("span");
    sep.className = "ticker-sep";
    sep.textContent = "◆";
    track.appendChild(sep);
  });
  // Adjust animation duration based on content width
  const totalW = track.scrollWidth / 2;
  const speed = totalW / 60; // px/s ≈ comfortable reading speed
  const dur = totalW / speed;
  track.style.animationDuration = dur + "s";
}

loadNews();                 // fetch live headlines on load
setInterval(loadNews, 15 * 60 * 1000); // refresh every 15 min
</script>
